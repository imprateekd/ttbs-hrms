name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Install the SDK platform GeckoView needs
        run: |
          set -x
          sdkmanager --list 2>/dev/null | grep -E "platforms;android-3[4-9]" | tail -20 || true
          yes | sdkmanager "platforms;android-37" 2>&1 | tail -5 || \
          yes | sdkmanager --channel=3 "platforms;android-37" 2>&1 | tail -5 || true

      - name: Install NDK (needed to strip GeckoView's native libraries)
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --install "ndk;26.1.10909125" 2>&1 | tail -3 || true
          ls -1 $ANDROID_HOME/ndk 2>/dev/null || echo "still no NDK"

      - name: Show available NDKs
        run: ls -1 $ANDROID_HOME/ndk 2>/dev/null || echo "no NDK preinstalled"

      - name: Build the debug APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: TTBS-HRMS-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Inspect GeckoView permission API
        if: always()
        run: |
          AAR=$(find ~/.gradle/caches -name "geckoview-arm64-v8a-121*.aar" | head -1)
          echo "aar: $AAR"
          mkdir -p /tmp/gv && unzip -o -q "$AAR" classes.jar -d /tmp/gv
          javap -classpath /tmp/gv/classes.jar 'org.mozilla.geckoview.GeckoSession$PermissionDelegate' | head -30
          echo "--- evaluate / load ---"
          javap -classpath /tmp/gv/classes.jar 'org.mozilla.geckoview.GeckoSession' | grep -iE "loadUri|reload|goBack" | head -6
          echo "--- who declares evaluateJS ---"
          mkdir -p /tmp/gvcls && unzip -o -q /tmp/gv/classes.jar -d /tmp/gvcls
          grep -rl "evaluateJS" /tmp/gvcls --include="*.class" | head -5
          echo "--- signature ---"
          for c in $(grep -rl "evaluateJS" /tmp/gvcls --include="*.class" | head -3); do
            n=$(echo "$c" | sed 's|/tmp/gvcls/||; s|\.class$||; s|/|.|g')
            javap -classpath /tmp/gv/classes.jar "$n" 2>/dev/null | grep -i "evaluateJS"
          done
