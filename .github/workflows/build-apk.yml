name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Install the SDK platform GeckoView needs
        run: |
          set -x
          sdkmanager --list 2>/dev/null | grep -E "platforms;android-3[4-9]" | tail -20 || true
          yes | sdkmanager "platforms;android-37" 2>&1 | tail -5 || \
          yes | sdkmanager --channel=3 "platforms;android-37" 2>&1 | tail -5 || true

      - name: Build the debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: TTBS-HRMS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
